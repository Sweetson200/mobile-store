<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f4f6f1">
	<title>Sign-in failed | Current Mobile</title>
	<style>
		:root { color-scheme: light; --ink: #172522; --muted: #68746f; --paper: #f4f6f1; --green: #285c4c; --lime: #d1ed7c; --coral: #e7785b; }
		* { box-sizing: border-box; }
		body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: var(--paper); color: var(--ink); font-family: "Aptos", "Segoe UI", sans-serif; }
		main { width: min(100%, 560px); padding: clamp(30px, 7vw, 64px); border-top: 4px solid var(--coral); background: #fff; animation: enter 400ms ease-out both; }
		.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 17px; font-weight: 750; text-decoration: none; }
		.mark { display: grid; width: 34px; height: 34px; place-items: center; background: var(--green); color: var(--lime); }
		.eyebrow { margin: 36px 0 10px; color: #9b4937; font-size: 12px; font-weight: 750; letter-spacing: 1.3px; text-transform: uppercase; }
		h1 { margin: 0 0 12px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 7vw, 48px); font-weight: 500; line-height: 1.08; }
		p { color: var(--muted); font-size: 15px; line-height: 1.6; }
		.link { display: inline-flex; min-height: 48px; align-items: center; justify-content: space-between; gap: 32px; margin-top: 18px; padding: 0 16px; background: var(--green); color: white; font-size: 14px; font-weight: 700; text-decoration: none; }
		.link:hover { background: #1c4438; }
		@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
	</style>
</head>
<body>
	<main aria-labelledby="error-title">
		<a class="brand" href="login.html" aria-label="Current Mobile">
			<span class="mark" aria-hidden="true">C</span><span>current<span style="color: #285c4c">.</span></span>
		</a>
		<p class="eyebrow">401 · Unauthorized</p>
		<h1 id="error-title">Those details didn't match.</h1>
		<p>Check your email and password, then try signing in again.</p>
		<a class="link" href="login.html"><span>Back to sign in</span><span aria-hidden="true">→</span></a>
	</main>
</body>
</html>
