<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Mobile Store</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172522;
            background: #f4f6f1;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }

        main {
            width: min(100%, 420px);
            padding: 40px;
            border-top: 4px solid #285c4c;
            background: #fff;
            box-shadow: 0 16px 48px rgb(23 37 34 / 8%);
        }

        h1 { margin: 0 0 8px; font-size: 30px; }
        p { color: #68746f; line-height: 1.5; }
        .field { margin: 22px 0; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #dce3dc;
            border-radius: 3px;
            font: inherit;
        }

        input:focus {
            border-color: #285c4c;
            outline: 3px solid rgb(40 92 76 / 15%);
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 3px;
            background: #285c4c;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover { background: #1c4438; }

        .message {
            margin: 20px 0 0;
            padding: 12px;
            border-radius: 3px;
        }

        .error { background: #fff0ec; color: #9d351f; }
        .success { background: #eef7e7; color: #285c4c; }

        [hidden] { display: none !important; }

        @media (max-width: 480px) {
            main { padding: 30px 24px; }
        }
    </style>
</head>
<body>
    <main>
        <section id="login-section" aria-labelledby="page-title">
            <h1 id="page-title">Welcome back</h1>
            <p>Sign in to your Mobile Store account.</p>
            <p id="login-message" class="message" role="alert" hidden></p>
            <form action="login" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit">Sign in</button>
            </form>
        </section>
        <section id="success-section" aria-labelledby="success-title" hidden>
            <h1 id="success-title">You’re signed in</h1>
            <p>Your login was successful.</p>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("login-message");
        if (params.get("error") === "invalid") {
            message.textContent = "Email or password is incorrect. Please try again.";
            message.classList.add("error");
            message.hidden = false;
        }
        if (params.get("success") === "true") {
            document.getElementById("login-section").hidden = true;
            document.getElementById("success-section").hidden = false;
        }
    </script>
</body>
</html>
